name: CI
on:
  push:
    branches: [main]
  pull_request:

# Воркфлоу ничего не публикует — достаточно чтения (иначе read-only дефолт).
permissions:
  contents: read

# Новый пуш в ту же ветку/PR отменяет ещё идущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: "Frontend build (tsc strict + vite)"
        run: npm ci && npm run build
      - name: "Rust checks (clippy -D warnings + tests)"
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
