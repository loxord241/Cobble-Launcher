[package]
name = "mc-launcher-v2"
version = "0.2.7"
description = "Быстрый и честный лаунчер Minecraft для Windows"
authors = ["loxord241"]
license = "MIT"
edition = "2021"
# Два бинарника: GUI (main.rs) и CLI mcl — tauri dev собирает дефолтный.
default-run = "mc-launcher-v2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mc_launcher_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# D29: точечные фичи вместо "full" — код не использует tokio::fs/process/signal.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
# socks (ENV-8): без фичи reqwest падает на «socks5://…» («socks proxy
# requires the 'socks' feature») — прокси сохранялся, но клиент не собирался.
# multipart (D59): прямая загрузка скина на ely.by (PUT authserver/api/skins).
reqwest = { version = "0.13.5", features = ["form", "json", "query", "stream", "socks", "multipart"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.26.1", features = ["v4"] }
dirs = "7.0.0"
regex = "1.13.1"
futures = "0.3.34"
zip = { version = "8.6.0", features = ["deflate"] }
flate2 = "1.1"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
# opener crate снят (D29): open_path/open_url из tauri-plugin-opener
tracing-appender = "0.2.5"
sysinfo = "0.39.6"
base64 = "0.23.1"
keyring = "4.2.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
